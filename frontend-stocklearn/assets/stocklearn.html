const APP_CONFIG = typeof window !== "undefined" ? window.__APP_CONFIG__ || {} : {};
const API_BASE_URL = APP_CONFIG.apiBaseUrl || "";
const ACCESS_TOKEN = APP_CONFIG.accessToken || "";

async function apiFetch(path, options) {
  if (!API_BASE_URL) {
    throw new Error("API base URL not configured");
  }

  const headers = {
    "Content-Type": "application/json",
    "ngrok-skip-browser-warning": "true",
  };

  if (options && options.headers) {
    Object.assign(headers, options.headers);
  }

  if (ACCESS_TOKEN) {
    headers.Authorization = "Bearer " + ACCESS_TOKEN;
  }

  const response = await fetch(API_BASE_URL + path, {
    ...(options || {}),
    headers,
  });

  let payload = null;
  try {
    payload = await response.json();
  } catch (err) {
    payload = null;
  }

  if (!response.ok) {
    const message =
      payload && (payload.message || payload.error)
        ? payload.message || payload.error
        : "Request failed";
    throw new Error(message);
  }

  return payload;
}

function pickNumber(value, fallback) {
  return typeof value === "number" && !Number.isNaN(value) ? value : fallback;
}

function pickArray(value, fallback) {
  return Array.isArray(value) ? value : fallback;
}

function pickString(value, fallback) {
  return typeof value === "string" && value.trim().length > 0 ? value : fallback;
}

function iconPath(name) {
  if (!name) return "";
  return name.indexOf(":") >= 0 ? name.replace(":", "/") : name;
}

function iconUrl(name, color, size) {
  if (!name) return "";
  const path = iconPath(name);
  const params = [];
  if (size) params.push(`height=${encodeURIComponent(size)}`);
  if (color) params.push(`color=${encodeURIComponent(color)}`);
  return `${ICONIFY_BASE}/${path}.svg${params.length ? "?" + params.join("&") : ""}`;
}

function isIconSafe(value) {
  if (!value || typeof value !== "string") return false;
  return value.indexOf("?") === -1 && value.indexOf("�") === -1;
}

function Icon({ name, size = 20, color = "#F8FAFC", style = {} }) {
  if (!name) return null;
  const src = iconUrl(name, color, size);
  return (
    <img
      src={src}
      alt=""
      width={size}
      height={size}
      style={{ display: "block", width: size, height: size, ...style }}
      loading="lazy"
    />
  );
}

const KEYWORD_ICON_MAP = [
  { keywords: ["bank", "banking"], icon: "mdi:bank" },
  { keywords: ["loan", "emi", "interest", "debt"], icon: "mdi:bank-transfer" },
  { keywords: ["budget", "expense", "saving", "wallet"], icon: "mdi:wallet" },
  { keywords: ["money", "cash", "income", "salary", "finance"], icon: "mdi:cash-multiple" },
  { keywords: ["stock", "market", "nepse", "share", "invest", "trading"], icon: "mdi:chart-line" },
  { keywords: ["insurance", "risk", "protect", "shield"], icon: "mdi:shield-check" },
  { keywords: ["vault", "secret", "facts"], icon: "mdi:safe" },
  { keywords: ["intro", "basic", "guide", "learn"], icon: "mdi:book-open-page-variant" },
];

const FACT_ICON_KEYS = ["mdi:lightbulb-on", "mdi:star-four-points", "mdi:brain"];

function resolveIconByKeyword(title, fallback) {
  if (!title || typeof title !== "string") return fallback;
  const lower = title.toLowerCase();
  for (const entry of KEYWORD_ICON_MAP) {
    if (entry.keywords.some((word) => lower.includes(word))) {
      return entry.icon;
    }
  }
  return fallback;
}

function resolveQuestIconKey(title, type, iconName) {
  if (type === "vault") return "mdi:safe";
  if (iconName && ICON_KEYS[iconName]) return ICON_KEYS[iconName];
  return resolveIconByKeyword(title, "mdi:book-open-page-variant");
}

function resolveChapterIconKey(title, index, iconName) {
  if (iconName && ICON_KEYS[iconName]) return ICON_KEYS[iconName];
  const fromTitle = resolveIconByKeyword(title, "");
  if (fromTitle) return fromTitle;
  return MODULE_ICON_KEYS[index % MODULE_ICON_KEYS.length];
}

function calculateStars(score) {
  if (!score || score <= 0) return 0;
  if (score >= 90) return 3;
  if (score >= 70) return 2;
  return 1;
}

function normalizeProgress(progress) {
  if (!Array.isArray(progress)) return [];
  return progress.map((item) => {
    const safe = item && typeof item === "object" ? item : {};
    let lessonId = safe.lessonId;
    if (lessonId && typeof lessonId === "object") {
      lessonId = lessonId._id || lessonId.id || lessonId.lessonId;
    }
    if (lessonId) {
      lessonId = String(lessonId);
    }
    return { ...safe, lessonId };
  });
}

function normalizeQuest(quest, index, chapterKey) {
  const safe = quest && typeof quest === "object" ? quest : {};
  const type = safe.type === "vault" ? "vault" : "lesson";
  const fallbackId = chapterKey + "-" + (index + 1);
  const id = safe.id || safe._id || fallbackId;
  const title = pickString(
    safe.title,
    type === "vault" ? "Mind Vault" : "Lesson " + (index + 1),
  );
  const iconName = typeof safe.icon === "string" ? safe.icon : "";
  const iconKey = resolveQuestIconKey(title, type, iconName);
  const order = pickNumber(safe.order, index);
  const xp = pickNumber(safe.xp, type === "vault" ? 20 : 50);

  const rawFlashcards = type === "lesson" ? pickArray(safe.flashcards, []) : [];
  const rawQuiz = type === "lesson" ? pickArray(safe.quiz, []) : [];
  const rawFacts = type === "vault" ? pickArray(safe.facts, []) : [];

  const flashcards = rawFlashcards
    .map((card, idx) => {
      const safeCard = card && typeof card === "object" ? card : {};
      const prompt = pickString(safeCard.prompt, "");
      const answer = pickString(safeCard.answer, "");
      return {
        id: pickNumber(safeCard.id, idx + 1),
        prompt,
        answer,
        tag: pickString(safeCard.tag, "Concept " + (idx + 1)),
      };
    })
    .filter((card) => card.prompt.length > 0);

  const quiz = rawQuiz
    .map((item) => {
      const safeQuiz = item && typeof item === "object" ? item : {};
      let answerIndex = 0;
      if (typeof safeQuiz.ans === "number") {
        answerIndex = safeQuiz.ans;
      } else if (typeof safeQuiz.correctOptionIndex === "number") {
        answerIndex = safeQuiz.correctOptionIndex;
      }

      const opts = pickArray(
        safeQuiz.opts,
        pickArray(safeQuiz.options, []),
      );

      return {
        q: pickString(safeQuiz.q, pickString(safeQuiz.prompt, "")),
        opts,
        ans: answerIndex,
        exp: pickString(
          safeQuiz.exp,
          pickString(safeQuiz.explanation, "Keep learning"),
        ),
      };
    })
    .filter((item) => item.q.length > 0 && item.opts.length > 0);

  const facts = rawFacts
    .map((fact, idx) => {
      const safeFact = fact && typeof fact === "object" ? fact : {};
      const factIconName = typeof safeFact.icon === "string" ? safeFact.icon : "";
      const factIconKey = factIconName.indexOf(":") >= 0
        ? factIconName
        : FACT_ICON_KEYS[idx % FACT_ICON_KEYS.length];
      return {
        iconKey: factIconKey,
        title: pickString(safeFact.title, "Key Insight " + (idx + 1)),
        body: pickString(safeFact.body, ""),
      };
    })
    .filter((fact) => fact.body.length > 0);

  return {
    id: String(id),
    title,
    iconKey,
    type,
    order,
    xp,
    flashcards,
    quiz,
    facts,
  };
}

function normalizeChapter(chapter, index) {
  const safe = chapter && typeof chapter === "object" ? chapter : {};
  const theme = COLOR_POOL[index % COLOR_POOL.length];
  const title = pickString(safe.title, "Chapter " + (index + 1));
  const key = pickString(safe.id, title);
  const quests = pickArray(safe.quests, []);

  const normalizedQuests = quests
    .map((quest, questIndex) => normalizeQuest(quest, questIndex, key))
    .sort((a, b) => pickNumber(a.order, 0) - pickNumber(b.order, 0));

  const color = pickString(safe.color, theme.color);
  const darkColor = pickString(safe.darkColor, theme.darkColor);
  const iconName = typeof safe.icon === "string" ? safe.icon : "";
  const iconKey = resolveChapterIconKey(title, index, iconName);
  const tagline = pickString(safe.tagline, "Level up your money skills");
  const xpTotal = normalizedQuests.reduce(
    (sum, quest) => sum + pickNumber(quest.xp, 0),
    0,
  );

  return {
    id: typeof safe.id === "number" ? safe.id : index + 1,
    key,
    title,
    iconKey,
    color,
    darkColor,
    tagline,
    xpTotal,
    quests: normalizedQuests,
  };
}

function normalizeFlow(payload) {
  const safe = payload && typeof payload === "object" ? payload : {};
  const chapters = pickArray(safe.chapters, []).map(normalizeChapter);
  const progress = normalizeProgress(safe.progress);
  const gamification = safe.gamification && typeof safe.gamification === "object"
    ? safe.gamification
    : {};
  return { chapters, progress, gamification };
}

function QuestBubble({
  quest,
  chapter,
  isLocked,
  isDone,
  isVault,
  stars,
  offset,
  onOpen,
}) {
  const nodeColor = isVault ? C.purple : chapter.color;
  const nodeDark = isVault ? "#4C1D95" : chapter.darkColor;
  const showCrown = !isLocked && !isDone && !isVault;

  return (
    <div
      style={{
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        transform: `translateX(${offset}px)`,
        transition: "transform 0.3s",
      }}
    >
      {showCrown && (
        <div
          style={{
            fontSize: 20,
            marginBottom: -2,
            display: "inline-block",
            animation: "duoCrown 1.2s ease-in-out infinite",
          }}
        >
          <EmojiText value="mdi:crown" style={{ fontSize: 20, color: C.gold }} />
        </div>
      )}
      <div
        onClick={() => {
          if (!isLocked) {
            onOpen(quest);
          }
        }}
        style={{
          width: 90,
          height: 90,
          borderRadius: "50%",
          background: `radial-gradient(circle at 30% 30%, ${nodeColor}, ${nodeDark})`,
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          fontSize: 30,
          cursor: isLocked ? "not-allowed" : "pointer",
          border: `4px solid ${isLocked ? C.border + "44" : nodeColor + "EE"}`,
          boxShadow: isLocked
            ? "none"
            : `0 10px 0 ${nodeDark}, 0 0 36px ${nodeColor}66`,
          opacity: isLocked ? 0.38 : 1,
          transition: "transform 0.15s, box-shadow 0.15s",
        }}
        onMouseEnter={(e) => {
          if (isLocked) return;
          e.currentTarget.style.transform = "scale(1.1) translateY(-3px)";
          e.currentTarget.style.boxShadow = `0 10px 0 ${nodeDark}, 0 0 36px ${nodeColor}66`;
        }}
        onMouseLeave={(e) => {
          if (isLocked) return;
          e.currentTarget.style.transform = "scale(1) translateY(0)";
          e.currentTarget.style.boxShadow = isDone
            ? `0 8px 0 ${nodeDark}, 0 0 30px ${nodeColor}66`
            : `0 10px 0 ${nodeDark}, 0 0 36px ${nodeColor}66`;
        }}
      >
        <div
          style={{
            position: "absolute",
            top: 0,
            left: 0,
            right: 0,
            height: "42%",
            background: "rgba(255,255,255,0.18)",
            borderRadius: "50% 50% 0 0",
            pointerEvents: "none",
          }}
        />
        {isLocked ? (
          <EmojiText value="mdi:lock" style={{ fontSize: 28, color: "#E2E8F0" }} />
        ) : (
          <EmojiText value={quest.iconKey} style={{ fontSize: 28, color: "#F8FAFC" }} />
        )}
      </div>
      <div
        style={{
          display: "flex",
          gap: 4,
          marginTop: 6,
          alignItems: "center",
        }}
      >
        {[1, 2, 3].map((s) => (
          <div
            key={s}
            style={{
              width: 8,
              height: 8,
              borderRadius: "50%",
              background: s <= stars ? C.gold : C.border,
              boxShadow:
                s <= stars
                  ? `0 0 10px ${C.gold}AA`
                  : "inset 0 0 0 1px rgba(255,255,255,0.1)",
              opacity: s <= stars ? 1 : 0.35,
              transform: s <= stars ? "scale(1.1)" : "scale(0.9)",
              transition: "all 0.3s",
            }}
          />
        ))}
      </div>
      <div
        style={{
          fontSize: 12,
          fontWeight: 700,
          color: isLocked ? C.muted : C.text,
          marginTop: 5,
          lineHeight: 1.3,
          opacity: isLocked ? 0.45 : 1,
          textAlign: "center",
        }}
      >
        {isVault ? "Mind Vault" : quest.title}
      </div>
      {!isLocked && (
        <div
          style={{
            marginTop: 6,
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            gap: 3,
          }}

            style={{

              borderRadius: 99,
              padding: "2px 9px",
              fontSize: 10,
              color: nodeColor,
              fontWeight: 800,

            {isDone ? "✓ " : "+"}

          <div style={{ fontSize: 9, color: C.muted }}>
            {quest.type === "lesson"

                ? "Secret Facts"
                : ""}
          </div>
        </div>
      )}
    </div>
  );
}

function QuestPath({ chapter, completedQuests, questStars, onOpenQuest }) {
  const offsets = [0, 38, -38, 16, -16];
  const quests = chapter.quests || [];

  return (
    <div style={{ marginBottom: 28 }}>
      <ChapterHeader
        chapter={chapter}
        completedCount={quests.filter((q) => completedQuests.has(q.id)).length}
        totalCount={quests.length}
      />
      <div
        style={{
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          width: "100%",
        }}
      >
        {quests.map((quest, index) => {
          const done = completedQuests.has(quest.id);
          const prevDone =
            index === 0 || completedQuests.has(quests[index - 1].id);
          const locked = !prevDone;
          const isVault = quest.type === "vault";
          const stars = questStars[quest.id] || 0;
          const offset = offsets[index % offsets.length];
          const prevOffset =
            index > 0 ? offsets[(index - 1) % offsets.length] : offset;
          const midOffset = Math.round((prevOffset + offset) / 2);
          const nodeColor = isVault ? C.purple : chapter.color;

          return (
            <div
              key={quest.id}
              style={{
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                width: "100%",
              }}
            >
              {index > 0 && (
                <div
                  style={{
                    display: "flex",
                    flexDirection: "column",
                    alignItems: "center",
                    gap: 6,
                    transform: `translateX(${midOffset}px)`,
                  }}
                >
                  {[0, 1, 2, 3].map((d) => (
                    <div
                      key={d}
                      style={{
                        width: 5,
                        height: 5,
                        borderRadius: "50%",
                        background:
                          done || prevDone
                            ? `${nodeColor}60`
                            : `${C.border}88`,
                      }}
                    />
                  ))}
                </div>
              )}
              <QuestBubble
                quest={quest}
                chapter={chapter}
                isLocked={locked}
                isDone={done}
                isVault={isVault}
                stars={stars}
                offset={offset}
                onOpen={onOpenQuest}
              />
            </div>
          );
        })}
      </div>
    </div>
  );
}

  onNext,
  onStartQuiz,
}) {
  const cards = quest.flashcards || [];
  const card = cards[fcIdx];

  const hasQuiz = quest.quiz && quest.quiz.length > 0;

  return (
    <div

function isBadgeEarned(badge, state) {
  if (badge.backendMatch && badge.backendMatch.length) {
    const backendEarned = (state.badges || []).some((item) =>
      badge.backendMatch.includes(item),
    );
    if (backendEarned) {
      return true;
    }
  }
  return badge.condition ? badge.condition(state) : false;
}

function GamifiedLearning() {
  const [chapters, setChapters] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState("");
  const [screen, setScreen] = useState("home");
  const [activeChapter, setActiveChapter] = useState(null);
  const [activeQuest, setActiveQuest] = useState(null);
  const [fcIdx, setFcIdx] = useState(0);
  const [fcFlipped, setFcFlipped] = useState(false);
  const [fcAnimating, setFcAnimating] = useState(false);
  const [quizIdx, setQuizIdx] = useState(0);
  const [quizAns, setQuizAns] = useState(null);
  const [quizScore, setQuizScore] = useState(0);
  const [quizDone, setQuizDone] = useState(false);
  const [quizAnswers, setQuizAnswers] = useState([]);
  const [quizStars, setQuizStars] = useState(0);
  const [particles, setParticles] = useState([]);
  const [heartAnim, setHeartAnim] = useState(false);
  const [wrongShake, setWrongShake] = useState(false);
  const [newBadges, setNewBadges] = useState([]);
  const [showBadgeToast, setShowBadgeToast] = useState(null);
  const flashcardViewedRef = useRef(new Set());

  const [gs, setGs] = useState(() => ({
    xp: 0,
    level: 1,
    streak: 0,
    freezes: 0,
    hearts: 5,
    maxHearts: 5,
    completedQuests: new Set(),
    perfectQuizzes: 0,
    totalFlips: 0,
    vaultsOpened: 0,
    earnedBadges: new Set(),
    badges: [],
    questStars: {},
    weeklyProgress: [],
    totalLessons: 0,
    completedLessons: 0,
    xpToNextLevel: 0,
    streakMessage: "",
  }));

  const badgeCatalog = useMemo(() => {
    const chapterBadges = chapters.map((chapter) => ({
      id: `unit_${chapter.title}`,
      icon: "mdi:trophy",
      title: `${chapter.title} Champ`,
      desc: `Complete ${chapter.title}`,
      backendMatch: [
        `Unit Completed: ${chapter.title}`,
        `Chapter Badge: ${chapter.title}`,
      ],
      condition: (s) =>
        chapter.quests.every((quest) => s.completedQuests.has(quest.id)),
    }));
    return [...BADGES, ...chapterBadges];
  }, [chapters]);

  const applyGamification = (snapshot) => {
    if (!snapshot || typeof snapshot !== "object") return;
    setGs((prev) => ({
      ...prev,
      xp: pickNumber(snapshot.xp, prev.xp),
      level: pickNumber(snapshot.level, prev.level),
      streak: pickNumber(snapshot.streakDays, prev.streak),
      freezes: pickNumber(snapshot.streakFreezes, prev.freezes),
      hearts: pickNumber(snapshot.hearts, prev.hearts),
      maxHearts: pickNumber(snapshot.maxHearts, prev.maxHearts),
      badges: pickArray(snapshot.badges, prev.badges),
      weeklyProgress: pickArray(snapshot.weeklyProgress, prev.weeklyProgress),
      totalLessons: pickNumber(snapshot.totalLessons, prev.totalLessons),
      completedLessons: pickNumber(snapshot.completedLessons, prev.completedLessons),
      xpToNextLevel: pickNumber(snapshot.xpToNextLevel, prev.xpToNextLevel),
      streakMessage: pickString(snapshot.streakMessage, prev.streakMessage),
    }));
  };

  const hydrateProgress = (progressPayload, gamificationPayload) => {
    const progress = normalizeProgress(progressPayload);
    const completedLessonIds = progress
      .filter((item) => item.completed)
      .map((item) => String(item.lessonId));

    const backendStars = progress.reduce((acc, item) => {
      if (item.bestScore > 0 && item.lessonId) {
        acc[String(item.lessonId)] = calculateStars(item.bestScore);
      }
      return acc;
    }, {});

    const perfectQuizzes = progress.filter((item) => item.bestScore >= 100).length;

    setGs((prev) => ({
      ...prev,
      completedQuests: new Set([...prev.completedQuests, ...completedLessonIds]),
      perfectQuizzes: Math.max(prev.perfectQuizzes, perfectQuizzes),
      questStars: { ...(prev.questStars || {}), ...backendStars },
    }));

    applyGamification(gamificationPayload);
  };

  useEffect(() => {
    let active = true;

    const loadData = async () => {
      setLoading(true);
      setLoadError("");
      try {
        const payload = await apiFetch("/learn/flow");
        if (!active) return;
        const normalized = normalizeFlow(payload);
        setChapters(normalized.chapters);
        hydrateProgress(normalized.progress, normalized.gamification);
      } catch (err) {
        if (!active) return;
        setLoadError(err && err.message ? err.message : "Failed to load lessons");
      } finally {
        if (active) {
          setLoading(false);
        }
      }
    };

    loadData();
    return () => {
      active = false;
    };
  }, []);

  useEffect(() => {
    const newlyEarned = badgeCatalog.filter(
      (b) => !gs.earnedBadges.has(b.id) && isBadgeEarned(b, gs),
    );
    if (newlyEarned.length > 0) {
      newlyEarned.forEach((b, i) => {
        setTimeout(() => {
          setShowBadgeToast(b);
          setTimeout(() => setShowBadgeToast(null), 3000);
        }, i * 3200);
      });
      setGs((prev) => ({
        ...prev,
        earnedBadges: new Set([
          ...prev.earnedBadges,
          ...newlyEarned.map((b) => b.id),
        ]),
      }));
    }
  }, [
    badgeCatalog,
    gs.xp,
    gs.streak,
    gs.completedQuests.size,
    gs.perfectQuizzes,
    gs.totalFlips,
    gs.vaultsOpened,
    gs.badges.length,
  ]);

  useEffect(() => {
    if (!newBadges.length) return;
    newBadges.forEach((badgeName, index) => {
      const mapped =
        badgeCatalog.find((badge) => badge.backendMatch && badge.backendMatch.includes(badgeName)) || {
          icon: "mdi:medal",
          title: badgeName,
          desc: "New achievement unlocked",
        };
      setTimeout(() => {
        setShowBadgeToast(mapped);
        setTimeout(() => setShowBadgeToast(null), 3000);
      }, index * 3200);
    });
    setNewBadges([]);
  }, [newBadges, badgeCatalog]);

  const spawnParticles = () => {
    const ps = Array.from({ length: 12 }, (_, i) => ({
      id: Date.now() + i,
      x: 40 + Math.random() * 20,
      y: 40 + Math.random() * 20,
      angle: (i / 12) * 360,
      color: ["#F59E0B", "#10B981", "#3B82F6", "#EF4444", "#8B5CF6", "#F97316"][i % 6],
    }));
    setParticles(ps);
    setTimeout(() => setParticles([]), 1200);
  };

  const recordFlashcardView = async (lessonId, count = 1) => {
    if (!lessonId) return;
    try {
      const payload = await apiFetch(`/progress/flashcard/${lessonId}`, {
        method: "POST",
        body: JSON.stringify({ count }),
      });
      if (payload && payload.xpAwarded) {
        applyGamification(payload.gamification);
        if (payload.newBadges && payload.newBadges.length) {
          setNewBadges(payload.newBadges);
        }
      }
    } catch (err) {
      return;
    }
  };

  const startLesson = async (lessonId) => {
    if (!lessonId) return true;
    try {
      await apiFetch(`/progress/start/${lessonId}`, { method: "POST" });
      return true;
    } catch (err) {
      setLoadError(err && err.message ? err.message : "Unable to start lesson");
      return false;
    }
  };

  const completeLesson = async (lessonId, starsOverride) => {
    if (!lessonId) return;
    try {
      const payload = await apiFetch(`/progress/complete/${lessonId}`, {
        method: "POST",
      });
      applyGamification(payload.gamification);
      if (payload.newBadges && payload.newBadges.length) {
        setNewBadges(payload.newBadges);
      }
      if (payload.progress && payload.progress.lessonId) {
        setGs((prev) => ({
          ...prev,
          completedQuests: new Set([
            ...prev.completedQuests,
            String(payload.progress.lessonId),
          ]),
          questStars: {
            ...(prev.questStars || {}),
            [String(payload.progress.lessonId)]: Math.max(
              starsOverride || 0,
              (prev.questStars || {})[String(payload.progress.lessonId)] || 0,
            ),
          },
        }));
      }
    } catch (err) {
      return;
    }
  };

  const submitQuiz = async (lessonId, answers) => {
    const payload = await apiFetch(`/progress/quiz/${lessonId}`, {
      method: "POST",
      body: JSON.stringify({ answers }),
    });
    return payload;
  };

  const loseHeart = () => {
    setWrongShake(true);
    setHeartAnim(true);
    setGs((prev) => ({ ...prev, hearts: Math.max(0, prev.hearts - 1) }));
    setTimeout(() => setWrongShake(false), 500);
    setTimeout(() => setHeartAnim(false), 400);
  };

  const resetQuestState = () => {
    setFcIdx(0);
    setFcFlipped(false);
    setFcAnimating(false);
    setQuizIdx(0);
    setQuizAns(null);
    setQuizScore(0);
    setQuizDone(false);
    setQuizAnswers([]);
    setQuizStars(0);
    setParticles([]);
  };

  const goHome = () => {
    resetQuestState();
    setScreen("home");
  };

  const handleOpenQuest = async (quest) => {
    const chapter = chapters.find((ch) => ch.quests.some((q) => q.id === quest.id));
    setActiveChapter(chapter || null);
    setActiveQuest(quest);

    if (quest.type === "vault") {
      setScreen("vault");
      return;
    }

    resetQuestState();
    const started = await startLesson(quest.id);
    if (!started) return;

    setScreen("flashcard");
  };

  const flipCard = () => {
    if (fcAnimating) return;
    setFcAnimating(true);
    setFcFlipped((prev) => !prev);
    setTimeout(() => setFcAnimating(false), 520);
    setGs((prev) => ({ ...prev, totalFlips: prev.totalFlips + 1 }));
  };

  const startQuiz = () => {
    setQuizIdx(0);
    setQuizAns(null);
    setQuizScore(0);
    setQuizDone(false);
    setQuizAnswers(Array(activeQuest.quiz.length).fill(-1));
    setScreen("quiz");
  };

  const nextCard = async () => {
    if (!activeQuest) return;
    const cards = activeQuest.flashcards || [];
    if (cards.length > 0 && fcIdx < cards.length - 1) {
      setFcIdx(fcIdx + 1);
      setFcFlipped(false);
      return;
    }

    if (activeQuest.quiz && activeQuest.quiz.length > 0) {
      startQuiz();
      return;
    }

    await completeLesson(activeQuest.id, 3);
    goHome();
  };

  const answerQuiz = (idx) => {
    if (quizAns !== null) return;
    setQuizAns(idx);
    setQuizAnswers((prev) => {
      const next = prev.slice();
      next[quizIdx] = idx;
      return next;
    });

    const correct = idx === activeQuest.quiz[quizIdx].ans;
    if (correct) {
      setQuizScore((prev) => prev + 1);
      spawnParticles();
    } else {
      loseHeart();
    }
  };

  const nextQuiz = async () => {
    if (!activeQuest) return;
    if (quizAns === null) return;

    if (quizIdx < activeQuest.quiz.length - 1) {
      setQuizIdx(quizIdx + 1);
      setQuizAns(null);
      return;
    }

    const total = activeQuest.quiz.length;
    const localScore = quizScore + (quizAns === activeQuest.quiz[quizIdx].ans ? 1 : 0);
    const answers = quizAnswers.map((item, index) =>
      index === quizIdx ? quizAns : item,
    );

    try {
      const result = await submitQuiz(activeQuest.id, answers);
      const scorePercent = typeof result.scorePercent === "number"
        ? result.scorePercent
        : Math.round((localScore / total) * 100);

      const stars = calculateStars(scorePercent);
      setQuizStars(stars);
      setQuizScore(result.correctAnswers ? localScore : localScore);
      setQuizDone(true);
      setGs((prev) => ({
        ...prev,
        questStars: {
          ...(prev.questStars || {}),
          [activeQuest.id]: Math.max(stars, (prev.questStars || {})[activeQuest.id] || 0),
        },
        perfectQuizzes: prev.perfectQuizzes + (scorePercent === 100 ? 1 : 0),
      }));
      applyGamification(result.gamification);
      if (result.newBadges && result.newBadges.length) {
        setNewBadges(result.newBadges);
      }
      if (result.passed) {
        await completeLesson(activeQuest.id, stars);
      }
    } catch (err) {
      setLoadError(err && err.message ? err.message : "Quiz submission failed");
      setQuizDone(true);
      setQuizStars(1);
    }
  };

  useEffect(() => {
    if (screen !== "flashcard" || !activeQuest || activeQuest.type !== "lesson") {
      return;
    }

    const key = `${activeQuest.id}:${fcIdx}`;
    if (flashcardViewedRef.current.has(key)) {
      return;
    }
    flashcardViewedRef.current.add(key);
    recordFlashcardView(activeQuest.id, 1);
  }, [screen, activeQuest, fcIdx]);

  const handleVaultComplete = () => {
    if (!activeQuest) return;
    setGs((prev) => ({
      ...prev,
      completedQuests: new Set([...prev.completedQuests, activeQuest.id]),
      vaultsOpened: prev.vaultsOpened + 1,
      questStars: { ...(prev.questStars || {}), [activeQuest.id]: 3 },
      xp: prev.xp + activeQuest.xp,
    }));
    goHome();
  };

  const totalQuests = chapters.reduce((a, ch) => a + ch.quests.length, 0);
  const completedCount = chapters.reduce(
    (a, ch) => a + ch.quests.filter((q) => gs.completedQuests.has(q.id)).length,
    0,
  );
  const totalStars = Object.values(gs.questStars || {}).reduce((a, s) => a + s, 0);

  return (
    <React.Fragment>
      <GlobalStyles />
      {screen === "flashcard" && activeQuest && activeChapter ? (
        <FlashcardLesson
          chapter={activeChapter}
          quest={activeQuest}
          fcIdx={fcIdx}
          fcFlipped={fcFlipped}
          fcAnimating={fcAnimating}
          hearts={gs.hearts}
          maxHearts={gs.maxHearts}
          onExit={goHome}
          onFlip={flipCard}
          onNext={nextCard}
          onStartQuiz={startQuiz}
        />
      ) : screen === "quiz" && activeQuest && activeChapter ? (
        <QuizComponent
          chapter={activeChapter}
          quest={activeQuest}
          quizIdx={quizIdx}
          quizAns={quizAns}
          quizScore={quizScore}
          quizDone={quizDone}
          quizStars={quizStars}
          quizAnswers={quizAnswers}
          particles={particles}
          heartAnim={heartAnim}
          wrongShake={wrongShake}
          hearts={gs.hearts}
          maxHearts={gs.maxHearts}
          onExit={goHome}
          onAnswer={answerQuiz}
          onNext={nextQuiz}
        />
      ) : screen === "vault" && activeQuest && activeChapter ? (
        <VaultFacts
          chapter={activeChapter}
          quest={activeQuest}
          onExit={goHome}
          onComplete={handleVaultComplete}
        />
      ) : screen === "badges" ? (
        <React.Fragment>
          <BadgesScreen badgeCatalog={badgeCatalog} gs={gs} onBack={() => setScreen("home")} />
          <BottomNav screen={screen} onNavigate={setScreen} />
          {showBadgeToast ? <BadgeToast badge={showBadgeToast} /> : null}
        </React.Fragment>
      ) : loading && chapters.length === 0 ? (
        <LoadingScreen />
      ) : loadError && chapters.length === 0 ? (
        <ErrorScreen message={loadError} />
      ) : (
        <div
          style={{
            background: C.bg,
            minHeight: "100vh",
            color: C.text,
            fontFamily: "'Segoe UI', system-ui, sans-serif",
            maxWidth: 430,
            margin: "0 auto",
            paddingBottom: 100,
            position: "relative",
            overflow: "hidden",
          }}
        >
          <TopNav
            gs={gs}
            completedCount={completedCount}
            totalQuests={totalQuests}
            totalStars={totalStars}
          />

          {gs.freezes > 0 && (
            <div
              style={{
                margin: "14px 20px",
                background: "linear-gradient(135deg, #1E293B, #1F2A44)",
                border: "1px solid #3B82F666",
                borderRadius: 16,
                padding: "14px 16px",
                display: "flex",
                alignItems: "center",
                gap: 12,
              }}
            >
              <div style={{ fontSize: 22 }}>
                <EmojiText value="mdi:snowflake" style={{ fontSize: 22, color: "#93C5FD" }} />
              </div>
              <div>
                <div style={{ fontSize: 12, fontWeight: 700, color: "#93C5FD" }}>
                  Streak Freeze Available ({gs.freezes})
                </div>
                <div style={{ fontSize: 11, color: C.muted }}>
                  Miss a day? Your streak is protected.
                </div>
              </div>
            </div>
          )}

          {loadError ? (
            <div style={{ margin: "0 20px 16px", fontSize: 12, color: "#FCA5A5" }}>{loadError}</div>
          ) : null}

          <div style={{ padding: "0 20px 20px" }}>
            {chapters.map((chapter) => (
              <QuestPath
                key={chapter.key}
                chapter={chapter}
                completedQuests={gs.completedQuests}
                questStars={gs.questStars || {}}
                onOpenQuest={handleOpenQuest}
              />
            ))}
          </div>

          <BottomNav screen={screen} onNavigate={setScreen} />
          {showBadgeToast ? <BadgeToast badge={showBadgeToast} /> : null}
        </div>
      )}
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<GamifiedLearning />);
if (window.ReactNativeWebView) {
  window.ReactNativeWebView.postMessage("ready");
}
  </script>
</body>
</html>
