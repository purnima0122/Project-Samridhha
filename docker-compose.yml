services:
  mongo:
    image: mongo:7
    container_name: samridhha-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
      - MONGO_INITDB_DATABASE=stocklearn
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend-nest
      dockerfile: Dockerfile
    container_name: samridhha-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend-nest/.env
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://admin:admin@mongo:27017/stocklearn?authSource=admin
      - DATA_SERVER_URL=http://localhost:4000
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  seed:
    build:
      context: ./backend-nest
      dockerfile: Dockerfile
    container_name: samridhha-seed
    environment:
      - MONGO_URI=mongodb://admin:admin@mongo:27017/stocklearn?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    command: [ "node", "seed/run-lesson-seed.js", "--mode", "upsert" ]
    restart: "no"

  data-server:
    build:
      context: ./Data-Server
      dockerfile: Dockerfile
    container_name: samridhha-data
    ports:
      - "4000:4000"
    env_file:
      - ./Data-Server/.env
    volumes:
      - ./Data:/Data
    restart: unless-stopped

  frontend:
    build:
      context: ./StockLaern
      dockerfile: Dockerfile
    container_name: samridhha-frontend
    ports:
      - "8092:8092"
    environment:
      - EXPO_PUBLIC_API_BASE_URL=http://localhost:3000
      - EXPO_PUBLIC_DATA_SERVER_URL=http://localhost:4000
    stdin_open: true
    tty: true
    depends_on:
      - backend
      - data-server
    restart: unless-stopped

volumes:
  mongo_data:
